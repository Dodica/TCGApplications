<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Entry Queue Scanner</title>
  <style>
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      color: #17202a;
      background: #eef2f6;
      font: 16px/1.4 Arial, sans-serif;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .topbar {
      padding: 14px 16px;
      color: #fff;
      background: #223044;
    }

    .topbar h1 {
      margin: 0;
      font-size: 18px;
    }

    .topbar p {
      margin: 3px 0 0;
      color: #cbd5e1;
      font-size: 13px;
    }

    main {
      display: grid;
      gap: 12px;
      align-content: start;
      padding: 12px;
    }

    .panel {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
    }

    .camera {
      position: relative;
      background: #000;
    }

    video {
      width: 100%;
      aspect-ratio: 3 / 4;
      display: block;
      object-fit: cover;
      background: #000;
    }

    .quagga-viewport video,
    .quagga-viewport canvas {
      width: 100%;
      aspect-ratio: 3 / 4;
      display: block;
      object-fit: cover;
      background: #000;
    }

    .quagga-viewport canvas {
      position: absolute;
      inset: 0;
      height: 100%;
      pointer-events: none;
    }

    .scan-line {
      position: absolute;
      left: 12%;
      right: 12%;
      top: 50%;
      height: 2px;
      background: #21d07a;
      box-shadow: 0 0 14px #21d07a;
    }

    .content {
      display: grid;
      gap: 10px;
      padding: 12px;
    }

    label {
      display: grid;
      gap: 5px;
      color: #526173;
      font-size: 13px;
      font-weight: 700;
    }

    input {
      width: 100%;
      min-height: 46px;
      border: 1px solid #aeb9c7;
      border-radius: 6px;
      padding: 9px 10px;
      color: #17202a;
      background: #fff;
      font-size: 18px;
    }

    button {
      min-height: 46px;
      border: 1px solid #9aa8b8;
      border-radius: 6px;
      padding: 9px 12px;
      color: #17202a;
      background: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
    }

    button.primary {
      color: #fff;
      border-color: #157347;
      background: #198754;
    }

    button:hover {
      background: #eef3f8;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    button:disabled:hover {
      background: #fff;
    }

    button.primary:hover {
      background: #157347;
    }

    button.primary:disabled:hover {
      background: #198754;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .queue-number {
      display: grid;
      place-items: center;
      min-height: 132px;
      padding: 12px;
      border: 2px solid #badbcc;
      border-radius: 8px;
      background: #f0f8f3;
      text-align: center;
    }

    .queue-number strong {
      display: block;
      color: #0f5132;
      font-size: clamp(54px, 22vw, 96px);
      line-height: 1;
      letter-spacing: 0;
    }

    .queue-number span {
      color: #0f5132;
      font-size: 15px;
    }

    .success-modal {
      position: fixed;
      z-index: 50;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
      background: rgba(9, 16, 27, .76);
    }

    .success-card {
      width: min(420px, 100%);
      border: 1px solid #badbcc;
      border-radius: 8px;
      padding: 20px;
      background: #f0f8f3;
      color: #0f5132;
      text-align: center;
      box-shadow: 0 18px 42px rgba(0, 0, 0, .28);
    }

    .success-card span {
      display: block;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .success-card strong {
      display: block;
      margin: 8px 0;
      font-size: clamp(86px, 30vw, 132px);
      line-height: .95;
      letter-spacing: 0;
    }

    .success-card p {
      margin: 0 0 16px;
      font-size: 18px;
      font-weight: 700;
    }

    .success-card button {
      width: 100%;
    }

    .status {
      min-height: 42px;
      border: 1px solid #d5dce5;
      border-radius: 6px;
      padding: 9px 10px;
      background: #fff;
      color: #526173;
    }

    .status[data-type="success"] {
      color: #0f5132;
      border-color: #badbcc;
      background: #f0f8f3;
    }

    .status[data-type="danger"] {
      color: #842029;
      border-color: #f5c2c7;
      background: #fff1f2;
    }

    .footerbar {
      padding: 10px 12px;
      color: #526173;
      font-size: 12px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Entry Queue Scanner</h1>
      <p>Scan IDs into the counter queue</p>
    </header>

    <main>
      <section class="panel camera" id="live-camera-panel" hidden>
        <video id="video" muted playsinline></video>
        <div id="quagga-viewport" class="quagga-viewport" hidden></div>
        <div class="scan-line"></div>
      </section>

      <section class="panel">
        <div class="content">
          <label>
            Scanner name
            <input id="scanner-name" autocomplete="name" placeholder="Your name">
          </label>

          <div class="actions">
            <button id="start-camera" class="primary" type="button">Start Live Camera</button>
            <button id="stop-camera" type="button">Stop</button>
          </div>

          <label>
            Manual ID
            <input id="manual-id" inputmode="numeric" pattern="[0-9]*" maxlength="10" autocomplete="off" placeholder="10 digits">
          </label>

          <button id="manual-submit" class="primary" type="button">Create Queue Number</button>

          <div class="queue-number" id="queue-card" hidden>
            <div>
              <span>Give player this number</span>
              <strong id="queue-no">000</strong>
            </div>
          </div>

          <div id="status" class="status">Ready.</div>
        </div>
      </section>
    </main>

    <footer class="footerbar">
      Phone scanners create queue numbers only. Accepted IDs are exactly 10 digits.
    </footer>
  </div>

  <div id="success-modal" class="success-modal" role="dialog" aria-modal="true" aria-labelledby="success-queue-label" hidden>
    <div class="success-card">
      <span id="success-queue-label">Queue number</span>
      <strong id="success-queue-no">000</strong>
      <p>Give this number to the player.</p>
      <button id="success-close" class="primary" type="button">Done</button>
    </div>
  </div>

  <script src="/public/quagga.min.js"></script>
  <script>
    (function () {
      "use strict";

      var SCANNER_NAME_KEY = "entry-queue-scanner-name";
      var DUPLICATE_SUPPRESS_MS = 8000;
      var BEEP_FREQUENCY = 880;
      var BEEP_VOLUME = 0.04;
      var BEEP_DURATION_MS = 120;
      var params = new URLSearchParams(location.search);
      var scanToken = params.get("scanToken") || "";
      var detector = null;
      var stream = null;
      var frame = 0;
      var cameraStarting = false;
      var scanning = false;
      var quaggaActive = false;
      var quaggaHandler = null;
      var submitting = false;
      var lastSubmittedId = "";
      var lastSubmittedAt = 0;
      var confirmationOpen = false;

      var liveCameraPanel = document.getElementById("live-camera-panel");
      var startCameraButton = document.getElementById("start-camera");
      var stopCameraButton = document.getElementById("stop-camera");
      var manualSubmitButton = document.getElementById("manual-submit");
      var video = document.getElementById("video");
      var quaggaViewport = document.getElementById("quagga-viewport");
      var statusEl = document.getElementById("status");
      var queueCard = document.getElementById("queue-card");
      var queueNoEl = document.getElementById("queue-no");
      var successModal = document.getElementById("success-modal");
      var successQueueNo = document.getElementById("success-queue-no");
      var successCloseButton = document.getElementById("success-close");
      var manualId = document.getElementById("manual-id");
      var scannerName = document.getElementById("scanner-name");

      scannerName.value = localStorage.getItem(SCANNER_NAME_KEY) || "";

      scannerName.addEventListener("input", function () {
        localStorage.setItem(SCANNER_NAME_KEY, scannerName.value.trim());
      });

      manualId.addEventListener("input", function () {
        var normalized = digitsOnly(manualId.value);
        if (manualId.value !== normalized) manualId.value = normalized;
        if (normalized.length === 10) {
          submitScan(normalized);
        }
      });

      manualId.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          submitScan(manualId.value);
        }
      });

      manualSubmitButton.addEventListener("click", function () {
        submitScan(manualId.value);
      });

      startCameraButton.addEventListener("click", startCamera);
      stopCameraButton.addEventListener("click", function () {
        stopCamera();
        setStatus("Camera stopped.", "");
      });
      successCloseButton.addEventListener("click", closeSuccessModal);
      updateControls();

      if (!scanToken) {
        setStatus("This scanner URL is missing the scan token.", "danger");
      } else if (!window.isSecureContext) {
        setStatus("Live camera is blocked on HTTP. Use HTTPS or mark this local URL as secure.", "danger");
      }

      async function startCamera() {
        if (cameraStarting || scanning) return;

        if (!scanToken) {
          setStatus("Missing scan token.", "danger");
          return;
        }

        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setStatus("Live camera is blocked. The phone browser needs this scanner URL to be secure.", "danger");
          return;
        }

        cameraStarting = true;
        updateControls();
        if (!("BarcodeDetector" in window)) {
          startQuaggaCamera();
          return;
        }

        try {
          detector = await createBarcodeDetector();
          if (!cameraStarting) return;

          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
          });

          if (!cameraStarting) {
            stream.getTracks().forEach(function (track) {
              track.stop();
            });
            stream = null;
            updateControls();
            return;
          }

          showNativeCamera();
          video.srcObject = stream;
          await video.play();
          scanning = true;
          cameraStarting = false;
          updateControls();
          setStatus("Scanning...", "");
          scanLoop();
        } catch (error) {
          stopCamera();
          setStatus("Could not start camera: " + error.message, "danger");
        }
      }

      function startQuaggaCamera() {
        if (!window.Quagga) {
          cameraStarting = false;
          updateControls();
          setStatus("This browser cannot read live barcodes.", "danger");
          return;
        }

        showQuaggaCamera();
        quaggaViewport.innerHTML = "";

        quaggaHandler = function (result) {
          if (confirmationOpen) return;
          var code = result && result.codeResult && result.codeResult.code;
          var id = readId(code);
          if (id) {
            submitScan(id);
          }
        };

        try {
          window.Quagga.init({
            inputStream: {
              name: "Live",
              type: "LiveStream",
              target: quaggaViewport,
              constraints: {
                facingMode: "environment"
              }
            },
            locator: {
              patchSize: "medium",
              halfSample: true
            },
            decoder: {
              readers: [
                "code_128_reader",
                "code_39_reader",
                "codabar_reader",
                "ean_reader",
                "ean_8_reader",
                "upc_reader",
                "upc_e_reader"
              ]
            },
            locate: true,
            numOfWorkers: Math.min(2, navigator.hardwareConcurrency || 1)
          }, function (error) {
            if (!cameraStarting) {
              stopQuagga(true);
              return;
            }

            if (error) {
              stopCamera();
              setStatus("Could not start live camera: " + (error.message || error), "danger");
              return;
            }

            scanning = true;
            cameraStarting = false;
            quaggaActive = true;
            window.Quagga.onDetected(quaggaHandler);
            window.Quagga.start();
            updateControls();
            setStatus("Scanning...", "");
          });
        } catch (error) {
          stopCamera();
          setStatus("Could not start live camera: " + (error.message || error), "danger");
        }
      }

      function stopCamera() {
        cameraStarting = false;
        scanning = false;
        if (frame) cancelAnimationFrame(frame);
        frame = 0;

        stopQuagga(true);

        if (stream) {
          stream.getTracks().forEach(function (track) {
            track.stop();
          });
        }

        stream = null;
        detector = null;
        video.srcObject = null;
        quaggaActive = false;
        quaggaHandler = null;
        quaggaViewport.innerHTML = "";
        hideCamera();
        updateControls();
      }

      function stopQuagga(force) {
        if (!window.Quagga) return;

        try {
          if (quaggaHandler && window.Quagga.offDetected) {
            window.Quagga.offDetected(quaggaHandler);
          }
          if (quaggaActive || force) {
            window.Quagga.stop();
          }
        } catch (error) {
          // The fallback library can throw if it was stopped during startup.
        }
      }

      function showNativeCamera() {
        liveCameraPanel.hidden = false;
        video.hidden = false;
        quaggaViewport.hidden = true;
      }

      function showQuaggaCamera() {
        liveCameraPanel.hidden = false;
        video.hidden = true;
        quaggaViewport.hidden = false;
      }

      function hideCamera() {
        video.hidden = false;
        quaggaViewport.hidden = true;
        liveCameraPanel.hidden = true;
      }

      async function scanLoop() {
        if (!scanning) return;

        if (!video || video.readyState < 2) {
          frame = requestAnimationFrame(scanLoop);
          return;
        }

        if (confirmationOpen) {
          frame = requestAnimationFrame(scanLoop);
          return;
        }

        try {
          var results = await detector.detect(video);
          if (results && results.length) {
            var id = readFirstCardGameId(results);
            if (id) {
              await submitScan(id);
            } else {
              setStatus("Ignored barcode. ID must be exactly 10 digits.", "danger");
            }
          }
        } catch (error) {
          stopCamera();
          setStatus("Scanner stopped: " + error.message, "danger");
          return;
        }

        frame = requestAnimationFrame(scanLoop);
      }

      async function submitScan(rawId) {
        var id = readId(rawId);
        var now = Date.now();

        if (!scanToken) {
          setStatus("Missing scan token.", "danger");
          return;
        }

        if (!/^\d{10}$/.test(id)) {
          setStatus("ID must be exactly 10 digits.", "danger");
          return;
        }

        if (submitting || confirmationOpen) {
          return;
        }

        if (id === lastSubmittedId && now - lastSubmittedAt < DUPLICATE_SUPPRESS_MS) {
          return;
        }

        submitting = true;
        updateControls();
        lastSubmittedId = id;
        lastSubmittedAt = now;

        try {
          var response = await fetch("/api/scans", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              id: id,
              scannerName: scannerName.value.trim() || "phone",
              scanToken: scanToken
            })
          });
          var payload = await readJson(response);

          if (!response.ok || !payload.ok) {
            throw new Error(payload.error || "Scan failed.");
          }

          manualId.value = "";
          showQueue(payload.entry);
        } catch (error) {
          lastSubmittedId = "";
          lastSubmittedAt = 0;
          setStatus(error.message, "danger");
        } finally {
          submitting = false;
          updateControls();
        }
      }

      function showQueue(entry) {
        confirmationOpen = true;
        queueNoEl.textContent = entry.queueNo;
        successQueueNo.textContent = entry.queueNo;
        queueCard.hidden = false;
        successModal.hidden = false;
        setStatus(entry.duplicate ? "Already scanned. Use the same queue number." : "Queue number created.", "success");
        successCloseButton.focus();
        notify();
      }

      function closeSuccessModal() {
        confirmationOpen = false;
        lastSubmittedAt = Date.now();
        successModal.hidden = true;
        updateControls();
        if (!scanning) manualId.focus();
      }

      async function readJson(response) {
        var text = await response.text();

        try {
          return text ? JSON.parse(text) : {};
        } catch (error) {
          return {
            ok: false,
            error: "Server returned an unreadable response."
          };
        }
      }

      function notify() {
        if (navigator.vibrate) navigator.vibrate([90, 40, 90]);

        try {
          var context = new (window.AudioContext || window.webkitAudioContext)();
          var oscillator = context.createOscillator();
          var gain = context.createGain();
          oscillator.frequency.value = BEEP_FREQUENCY;
          gain.gain.value = BEEP_VOLUME;
          oscillator.connect(gain);
          gain.connect(context.destination);
          oscillator.start();
          setTimeout(function () {
            oscillator.stop();
            context.close();
          }, BEEP_DURATION_MS);
        } catch (error) {
          // Vibration is enough when audio is unavailable.
        }
      }

      function digitsOnly(value) {
        return String(value || "")
          .replace(/\D/g, "");
      }

      function readId(value) {
        var digits = digitsOnly(value);
        return /^\d{10}$/.test(digits) ? digits : "";
      }

      function readFirstCardGameId(results) {
        if (!results || !results.length) return "";

        for (var i = 0; i < results.length; i += 1) {
          var id = readId(results[i].rawValue);
          if (id) return id;
        }

        return "";
      }

      async function createBarcodeDetector() {
        var formats = await BarcodeDetector.getSupportedFormats();
        var preferred = formats.filter(function (format) {
          return ["code_128", "code_39", "code_93", "codabar", "ean_13", "ean_8", "qr_code", "upc_a", "upc_e"].indexOf(format) !== -1;
        });

        return new BarcodeDetector({ formats: preferred.length ? preferred : formats });
      }

      function setStatus(message, type) {
        statusEl.textContent = message;
        statusEl.dataset.type = type || "";
      }

      function updateControls() {
        startCameraButton.disabled = cameraStarting || scanning || !scanToken;
        stopCameraButton.disabled = !cameraStarting && !scanning;
        manualSubmitButton.disabled = submitting || confirmationOpen || !scanToken;
      }
    })();
  </script>
</body>
</html>
