<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entry Queue Counter</title>
  <style>
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      color: #17202a;
      background: #eef2f6;
      font: 15px/1.4 Arial, sans-serif;
    }

    .app {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      color: #fff;
      background: #223044;
    }

    .topbar h1 {
      margin: 0;
      font-size: 18px;
    }

    .topbar p {
      margin: 2px 0 0;
      color: #cbd5e1;
      font-size: 12px;
    }

    .topbar__actions {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    main {
      display: grid;
      grid-template-columns: minmax(320px, 420px) 1fr;
      gap: 12px;
      padding: 12px;
    }

    .panel {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      overflow: hidden;
    }

    .panel__header {
      display: block;
      padding: 10px 12px;
      color: #17202a;
      background: #f8fafc;
      border-bottom: 1px solid #d5dce5;
    }

    .panel__header h2 {
      margin: 0;
      font-size: 15px;
    }

    .content {
      display: grid;
      gap: 10px;
      padding: 12px;
    }

    label {
      display: grid;
      gap: 5px;
      color: #526173;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      min-height: 42px;
      border: 1px solid #aeb9c7;
      border-radius: 6px;
      padding: 8px 10px;
      color: #17202a;
      background: #fff;
      font-size: 16px;
    }

    .queue-input {
      min-height: 62px;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0;
      text-align: center;
    }

    button {
      min-height: 40px;
      border: 1px solid #9aa8b8;
      border-radius: 6px;
      padding: 8px 10px;
      color: #17202a;
      background: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    .file-button {
      display: inline-grid;
      place-items: center;
      min-height: 40px;
      border: 1px solid #9aa8b8;
      border-radius: 6px;
      padding: 8px 10px;
      color: #17202a;
      background: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    button.primary {
      color: #fff;
      border-color: #157347;
      background: #198754;
    }

    button.danger {
      color: #842029;
      border-color: #b02a37;
      background: #fff;
    }

    button:hover,
    .file-button:hover {
      background: #eef3f8;
    }

    .file-button[data-disabled="true"] {
      opacity: .55;
      pointer-events: none;
      cursor: not-allowed;
    }

    button.primary:hover {
      background: #157347;
    }

    button.danger:hover {
      background: #fff1f2;
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .row > * {
      min-width: 0;
      flex: 1;
    }

    .status {
      min-height: 38px;
      border: 1px solid #d5dce5;
      border-radius: 6px;
      padding: 8px 10px;
      color: #526173;
      background: #fff;
    }

    .status[data-type="success"] {
      color: #0f5132;
      border-color: #badbcc;
      background: #f0f8f3;
    }

    .status[data-type="danger"] {
      color: #842029;
      border-color: #f5c2c7;
      background: #fff1f2;
    }

    .id-card {
      display: grid;
      gap: 6px;
      min-height: 118px;
      border: 2px solid #badbcc;
      border-radius: 8px;
      padding: 12px;
      background: #f0f8f3;
    }

    .id-card span {
      color: #0f5132;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .id-card strong {
      color: #0f5132;
      font-size: clamp(30px, 6vw, 46px);
      line-height: 1;
      letter-spacing: 0;
      word-break: break-all;
    }

    .id-card .badge {
      width: max-content;
      font-style: normal;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .stat {
      border: 1px solid #d5dce5;
      border-radius: 6px;
      padding: 8px;
      background: #f8fafc;
    }

    .stat span {
      display: block;
      color: #526173;
      font-size: 11px;
      text-transform: uppercase;
    }

    .stat strong {
      display: block;
      margin-top: 2px;
      font-size: 22px;
    }

    .summary {
      min-height: 34px;
      border: 1px solid #d5dce5;
      border-radius: 6px;
      padding: 7px 9px;
      color: #526173;
      background: #fff;
      font-size: 13px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    .table-wrap {
      overflow: auto;
    }

    th,
    td {
      padding: 8px;
      border-bottom: 1px solid #e1e7ef;
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: #526173;
      background: #f8fafc;
      font-size: 12px;
      text-transform: uppercase;
    }

    td:first-child {
      width: 86px;
      font-weight: 800;
      font-size: 18px;
    }

    tbody tr[data-queue-no] {
      cursor: pointer;
    }

    tbody tr[data-queue-no]:hover {
      background: #f8fafc;
    }

    .badge {
      display: inline-block;
      min-width: 72px;
      border-radius: 999px;
      padding: 3px 8px;
      color: #526173;
      background: #eef2f6;
      font-size: 12px;
      text-align: center;
    }

    .badge.waiting {
      color: #0f5132;
      background: #d1e7dd;
    }

    .badge.done {
      color: #084298;
      background: #cfe2ff;
    }

    .badge.preregistered {
      color: #0f5132;
      background: #d1e7dd;
    }

    .badge.not-preregistered {
      color: #664d03;
      background: #fff3cd;
    }

    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <h1>Entry Queue Counter</h1>
        <p>Type a queue number to reveal the ID</p>
      </div>
      <div class="topbar__actions">
        <label class="file-button" for="prereg-file">Import CSV</label>
        <button id="export-csv" type="button">Export CSV</button>
        <button id="clear-queue" class="danger" type="button">Clear Queue</button>
      </div>
      <input id="prereg-file" type="file" accept=".csv,text/csv" hidden>
    </header>

    <main>
      <section class="panel">
        <header class="panel__header">
          <h2>Counter Lookup</h2>
        </header>

        <div class="content">
          <label>
            Queue number
            <input id="queue-no" class="queue-input" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autofocus>
          </label>

          <div class="id-card" id="id-card" hidden>
            <span>ID</span>
            <strong id="card-game-id"></strong>
            <em id="selected-prereg" class="badge not-preregistered">Not pre-registered</em>
          </div>

          <div id="selected-actions" class="row" hidden>
            <button id="done" class="primary" type="button">Done</button>
            <button id="waiting" type="button">Back to Waiting</button>
          </div>

          <div id="status" class="status">Ready.</div>
        </div>
      </section>

      <section class="panel">
        <header class="panel__header">
          <h2>Queue</h2>
        </header>

        <div class="content">
          <div class="stats">
            <div class="stat"><span>Waiting</span><strong id="waiting-count">0</strong></div>
            <div class="stat"><span>Done</span><strong id="done-count">0</strong></div>
          </div>
          <div id="prereg-summary" class="summary">No pre-registration CSV loaded.</div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Queue</th>
                <th>ID</th>
                <th>Registration</th>
                <th>Status</th>
                <th>Scanner</th>
                <th>Time</th>
              </tr>
            </thead>
            <tbody id="queue-body">
              <tr><td colspan="6">No entries yet.</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script>
    (function () {
      "use strict";

      var ADMIN_TOKEN_KEY = "entry-queue-counter-admin-token";
      var POLL_INTERVAL_MS = 1500;
      var preregImportLabel = "Import CSV";
      var params = new URLSearchParams(location.search);
      var state = {
        adminToken: params.get("adminToken") || localStorage.getItem(ADMIN_TOKEN_KEY) || "",
        preRegistrationCount: 0,
        entries: [],
        selected: null
      };

      var queueInput = document.getElementById("queue-no");
      var doneButton = document.getElementById("done");
      var waitingButton = document.getElementById("waiting");
      var preregFileInput = document.getElementById("prereg-file");
      var preregFileLabel = document.querySelector("label[for='prereg-file']");
      var exportButton = document.getElementById("export-csv");
      var clearQueueButton = document.getElementById("clear-queue");
      var statusEl = document.getElementById("status");
      var idCard = document.getElementById("id-card");
      var idEl = document.getElementById("card-game-id");
      var selectedPrereg = document.getElementById("selected-prereg");
      var queueBody = document.getElementById("queue-body");
      var selectedActions = document.getElementById("selected-actions");
      var waitingCount = document.getElementById("waiting-count");
      var doneCount = document.getElementById("done-count");
      var preregSummary = document.getElementById("prereg-summary");

      if (params.get("adminToken")) {
        localStorage.setItem(ADMIN_TOKEN_KEY, state.adminToken);
      }

      queueInput.addEventListener("input", function () {
        var normalized = digitsOnly(queueInput.value);
        if (queueInput.value !== normalized) queueInput.value = normalized;
      });

      queueInput.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          lookup();
        }
      });

      doneButton.addEventListener("click", function () {
        updateSelectedStatus("done");
      });
      waitingButton.addEventListener("click", function () {
        updateSelectedStatus("waiting");
      });
      preregFileInput.addEventListener("click", function () {
        preregFileInput.value = "";
      });
      preregFileInput.addEventListener("change", function () {
        importPreRegistrationFile(preregFileInput.files && preregFileInput.files[0]);
      });
      exportButton.addEventListener("click", exportCsv);
      clearQueueButton.addEventListener("click", clearQueue);

      queueBody.addEventListener("click", function (event) {
        var row = event.target.closest("tr[data-queue-no]");
        if (!row) return;
        queueInput.value = row.dataset.queueNo;
        lookup();
      });

      if (!state.adminToken) {
        setStatus("Open the counter with its adminToken link.", "danger");
      }

      setInterval(poll, POLL_INTERVAL_MS);
      poll();

      function lookup() {
        var queueNo = normalizeQueueNo(queueInput.value);
        if (!queueNo) {
          setStatus("Enter a queue number.", "danger");
          return;
        }

        var entry = findEntry(queueNo);
        if (!entry) {
          setStatus("Queue number not found.", "danger");
          clearSelected();
          return;
        }

        state.selected = entry;
        idEl.textContent = entry.id;
        renderRegistrationBadge(selectedPrereg, entry);
        idCard.hidden = false;
        selectedActions.hidden = false;
        queueInput.value = "";
        setStatus("Queue " + entry.queueNo + " found.", "success");
      }

      function updateSelectedStatus(status) {
        if (!state.selected) {
          setStatus("Lookup a queue number first.", "danger");
          return;
        }

        updateStatus(state.selected.queueNo, status);
      }

      function updateStatus(queueNo, status) {
        if (!hasAdminToken()) return;

        fetch("/api/queue/" + encodeURIComponent(queueNo), {
          method: "PATCH",
          headers: {
            "Content-Type": "application/json",
            "X-Admin-Token": state.adminToken
          },
          body: JSON.stringify({ status: status })
        }).then(function (response) {
          return response.json().then(function (payload) {
            if (!response.ok || !payload.ok) throw new Error(payload.error || "Update failed.");
            clearSelected();
            queueInput.focus();
            setStatus("Queue " + queueNo + " marked " + statusLabel(status) + ".", "success");
            poll();
          });
        }).catch(function (error) {
          setStatus(error.message, "danger");
        });
      }

      function poll() {
        if (!hasAdminToken(true)) return;

        fetch("/api/queue", {
          headers: { "X-Admin-Token": state.adminToken }
        }).then(function (response) {
          return response.json().then(function (payload) {
            if (!response.ok || !payload.ok) throw new Error(payload.error || "Queue load failed.");
            state.entries = Array.isArray(payload.entries) ? payload.entries : [];
            state.preRegistrationCount = Number(payload.preRegistrationCount || 0);
            renderQueue();
          });
        }).catch(function (error) {
          setStatus(error.message, "danger");
        });
      }

      function renderQueue() {
        var waiting = 0;
        var done = 0;

        state.entries.forEach(function (entry) {
          if (entry.status === "waiting") waiting += 1;
          if (entry.status === "done") done += 1;
        });

        waitingCount.textContent = String(waiting);
        doneCount.textContent = String(done);
        preregSummary.textContent = state.preRegistrationCount
          ? state.preRegistrationCount + " pre-registered IDs loaded."
          : "No pre-registration CSV loaded.";

        if (state.selected) {
          state.selected = findEntry(state.selected.queueNo);
          if (state.selected) {
            renderRegistrationBadge(selectedPrereg, state.selected);
          } else {
            clearSelected();
          }
        }

        var visible = state.entries.slice().sort(function (a, b) {
          return Number(a.queueNo) - Number(b.queueNo);
        });

        queueBody.innerHTML = visible.map(function (entry) {
          var time = entry.scannedAt ? new Date(entry.scannedAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
          return "<tr data-queue-no=\"" + escapeHtml(entry.queueNo) + "\">" +
            "<td>" + escapeHtml(entry.queueNo) + "</td>" +
            "<td>" + escapeHtml(entry.id) + "</td>" +
            "<td><span class=\"badge " + registrationClass(entry) + "\">" + escapeHtml(registrationLabel(entry)) + "</span></td>" +
            "<td><span class=\"badge " + escapeHtml(entry.status) + "\">" + escapeHtml(statusLabel(entry.status)) + "</span></td>" +
            "<td>" + escapeHtml(entry.scannerName || "") + "</td>" +
            "<td>" + escapeHtml(time) + "</td>" +
            "</tr>";
        }).join("") || "<tr><td colspan=\"6\">No entries yet.</td></tr>";
      }

      function exportCsv() {
        var rows = [["queueNo", "id", "preRegistered", "status", "scannerName", "scannedAt", "doneAt"]];
        state.entries.forEach(function (entry) {
          rows.push([
            entry.queueNo,
            entry.id,
            entry.preRegistered ? "yes" : "no",
            entry.status,
            entry.scannerName || "",
            entry.scannedAt || "",
            entry.doneAt || ""
          ]);
        });

        var csv = rows.map(function (row) {
          return row.map(csvCell).join(",");
        }).join("\n");
        var blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        var link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "entry-queue.csv";
        document.body.appendChild(link);
        link.click();
        URL.revokeObjectURL(link.href);
        link.remove();
      }

      function clearQueue() {
        if (!hasAdminToken()) return;

        if (!confirm("Clear all queue entries and restart numbering at 001? The imported CSV stays loaded.")) {
          return;
        }

        fetch("/api/queue", {
          method: "DELETE",
          headers: { "X-Admin-Token": state.adminToken }
        }).then(function (response) {
          return response.json().then(function (payload) {
            if (!response.ok || !payload.ok) throw new Error(payload.error || "Clear failed.");
            state.entries = [];
            clearSelected();
            renderQueue();
            queueInput.focus();
            setStatus("Queue cleared. Next scan will be 001.", "success");
            poll();
          });
        }).catch(function (error) {
          setStatus(error.message, "danger");
        });
      }

      function importPreRegistrationFile(file) {
        if (!file) return;

        if (!hasAdminToken()) return;

        setImporting(true, "Reading CSV...");
        setStatus("Reading " + file.name + "...", "");

        var reader = new FileReader();
        reader.onload = function () {
          var ids = extractPreRegistrationIds(String(reader.result || ""));
          if (!ids.length) {
            setStatus("No 10-digit IDs found in that CSV.", "danger");
            setImporting(false);
            return;
          }

          uploadPreRegistrationIds(ids, file.name);
        };
        reader.onerror = function () {
          setStatus("Could not read that CSV file.", "danger");
          setImporting(false);
        };
        reader.readAsText(file);
      }

      function uploadPreRegistrationIds(ids, fileName) {
        if (!hasAdminToken()) {
          setImporting(false);
          return;
        }

        setImporting(true, "Uploading...");
        setStatus("Uploading " + ids.length + " pre-registered IDs...", "");

        fetch("/api/preregistration", {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            "X-Admin-Token": state.adminToken
          },
          body: JSON.stringify({ ids: ids })
        }).then(function (response) {
          return response.json().then(function (payload) {
            if (!response.ok || !payload.ok) throw new Error(payload.error || "Import failed.");
            state.preRegistrationCount = Number(payload.count || ids.length);
            setStatus("Loaded " + state.preRegistrationCount + " pre-registered IDs from " + fileName + ".", "success");
            poll();
          });
        }).catch(function (error) {
          setStatus(error.message, "danger");
        }).finally(function () {
          setImporting(false);
        });
      }

      function extractPreRegistrationIds(text) {
        var seen = {};
        var ids = [];

        parseCsv(text).forEach(function (row) {
          row.forEach(function (cell) {
            var id = readCardGameId(cell);
            if (id && !seen[id]) {
              seen[id] = true;
              ids.push(id);
            }
          });
        });

        return ids;
      }

      function parseCsv(text) {
        var rows = [];
        var row = [];
        var cell = "";
        var inQuotes = false;

        for (var i = 0; i < text.length; i += 1) {
          var character = text[i];
          var next = text[i + 1];

          if (character === "\"") {
            if (inQuotes && next === "\"") {
              cell += "\"";
              i += 1;
            } else {
              inQuotes = !inQuotes;
            }
          } else if (character === "," && !inQuotes) {
            row.push(cell);
            cell = "";
          } else if ((character === "\n" || character === "\r") && !inQuotes) {
            if (character === "\r" && next === "\n") i += 1;
            row.push(cell);
            rows.push(row);
            row = [];
            cell = "";
          } else {
            cell += character;
          }
        }

        row.push(cell);
        rows.push(row);
        return rows;
      }

      function findEntry(queueNo) {
        return state.entries.find(function (entry) {
          return entry.queueNo === queueNo;
        }) || null;
      }

      function clearSelected() {
        state.selected = null;
        idEl.textContent = "";
        selectedPrereg.textContent = "Not pre-registered";
        selectedPrereg.className = "badge not-preregistered";
        idCard.hidden = true;
        selectedActions.hidden = true;
      }

      function hasAdminToken(silent) {
        if (!state.adminToken) {
          if (!silent) setStatus("Open the counter with its adminToken link.", "danger");
          return false;
        }

        return true;
      }

      function digitsOnly(value) {
        return String(value || "")
          .replace(/\D/g, "");
      }

      function readCardGameId(value) {
        var digits = digitsOnly(value);
        return /^\d{10}$/.test(digits) ? digits : "";
      }

      function normalizeQueueNo(value) {
        var digits = digitsOnly(value);
        var unpadded = digits.replace(/^0+/, "");
        if (!digits) return "";
        return (unpadded || "0").padStart(3, "0");
      }

      function statusLabel(status) {
        return status || "unknown";
      }

      function registrationLabel(entry) {
        return entry && entry.preRegistered ? "Pre-registered" : "Not pre-registered";
      }

      function registrationClass(entry) {
        return entry && entry.preRegistered ? "preregistered" : "not-preregistered";
      }

      function renderRegistrationBadge(element, entry) {
        element.textContent = registrationLabel(entry);
        element.className = "badge " + registrationClass(entry);
      }

      function setImporting(importing, label) {
        preregFileLabel.textContent = importing ? label : preregImportLabel;
        preregFileLabel.dataset.disabled = importing ? "true" : "false";
      }

      function setStatus(message, type) {
        statusEl.textContent = message;
        statusEl.dataset.type = type || "";
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function csvCell(value) {
        var text = String(value == null ? "" : value);
        if (/["\n,]/.test(text)) return "\"" + text.replace(/"/g, "\"\"") + "\"";
        return text;
      }
    })();
  </script>
</body>
</html>
